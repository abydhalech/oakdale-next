name: Dependency security audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - package-lock.json
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
